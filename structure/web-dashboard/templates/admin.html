<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Code Migration Pipeline - Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="admin-dashboard">
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-header-content">
                <h1><i class="fas fa-cog"></i> Legacy Code Migration Pipeline - Admin Panel</h1>
                <div class="admin-header-actions">
                    <div class="header-info">
                        <span id="admin-project-name">Loading...</span>
                        <span class="separator">|</span>
                        <span id="admin-last-updated">Last updated: Loading...</span>
                    </div>
                    <button onclick="window.location.href='/'" class="btn-primary">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Directory Navigation -->
            <div class="admin-sidebar">
                <div class="directory-nav">
                    <h3><i class="fas fa-folder-tree"></i> Resources</h3>
                    <div class="nav-items">
                        <div class="nav-item active" data-directory="agents">
                            <i class="fas fa-robot"></i>
                            <span>Agents</span>
                            <span class="file-count" id="agents-count">0</span>
                        </div>
                        <div class="nav-item" data-directory="input">
                            <i class="fas fa-file-import"></i>
                            <span>Input</span>
                            <span class="file-count" id="input-count">0</span>
                        </div>
                        <div class="nav-item" data-directory="prompts">
                            <i class="fas fa-comment-dots"></i>
                            <span>Prompts</span>
                            <span class="file-count" id="prompts-count">0</span>
                        </div>
                        <div class="nav-item" data-directory="config">
                            <i class="fas fa-cog"></i>
                            <span>Configuration</span>
                            <span class="file-count" id="config-count">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="admin-content">
                <!-- Directory Header -->
                <div class="content-header">
                    <div class="breadcrumb">
                        <i class="fas fa-folder"></i>
                        <span id="current-directory">agents</span>
                        <span id="current-path">/agents</span>
                        <span class="depth-info" title="Directory tree displays up to 10 levels deep">
                            <i class="fas fa-info-circle"></i> Max depth: 10 levels
                        </span>
                    </div>
                    <div class="content-actions">
                        <button id="refresh-btn" class="btn-secondary">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button id="new-file-btn" class="btn-primary">
                            <i class="fas fa-plus"></i> New File
                        </button>
                    </div>
                </div>

                <!-- File List -->
                <div class="file-list-container">
                    <div class="file-list-header">
                        <div class="file-col-name">Name</div>
                        <div class="file-col-size">Size</div>
                        <div class="file-col-modified">Modified</div>
                        <div class="file-col-actions">Actions</div>
                    </div>
                    <div id="file-list" class="file-list">
                        <!-- Files will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- File Editor Modal -->
    <div id="file-editor-modal" class="modal">
        <div class="modal-content file-editor">
            <div class="modal-header">
                <h3 id="editor-title">Edit File</h3>
                <div class="modal-actions">
                    <button id="preview-file-btn" class="btn-info">
                        <i class="fas fa-eye"></i> Preview
                    </button>
                    <button id="save-file-btn" class="btn-primary">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <button id="close-editor-btn" class="btn-secondary">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="editor-container">
                    <textarea id="file-content" placeholder="File content..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div id="file-preview-modal" class="modal">
        <div class="modal-content file-preview">
            <div class="modal-header">
                <h3 id="preview-title">File Preview</h3>
                <div class="modal-actions">
                    <button id="close-preview-btn" class="btn-secondary">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div id="preview-container" class="preview-container">
                    <!-- Preview content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- New File Modal -->
    <div id="new-file-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New File</h3>
                <button id="close-new-file-btn" class="btn-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="new-file-name">File Name:</label>
                    <input type="text" id="new-file-name" placeholder="example.md">
                </div>
                <div class="form-group">
                    <label for="new-file-content">Content:</label>
                    <textarea id="new-file-content" rows="10" placeholder="File content..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="create-file-btn" class="btn-primary">
                    <i class="fas fa-plus"></i> Create
                </button>
                <button id="cancel-new-file-btn" class="btn-secondary">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
